<!doctype html>
<!--
  Tablet screen for the 3D demo table: two real StudyQuest screenshots side by side.
  The phone screens themselves are cropped screenshots in public/assets/screens/.
  Render with: python3 design-src/render.py screens
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Sora'; src: url('../node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #555; padding: 40px; }
#tablet { width: 768px; height: 1024px; background: #FCF1E3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; font-family: 'Sora', sans-serif; }
.row { display: flex; gap: 20px; }
.screen { width: 352px; border-radius: 26px; overflow: hidden; box-shadow: 0 10px 30px rgba(120, 70, 30, .18); border: 3px solid #fff; }
.screen img { display: block; width: 100%; }
h1 { font-size: 34px; font-weight: 800; color: #3A2A1E; letter-spacing: -0.02em; }
h1 span { color: #E9935B; }
p { font-size: 17px; font-weight: 600; color: #85705E; margin-top: -14px; }
</style>
</head>
<body>
<section id="tablet">
  <h1>Study<span>Quest</span></h1>
  <p>studyquest-a547c.web.app</p>
  <div class="row">
    <div class="screen"><img src="../public/assets/screens/home.webp" alt=""></div>
    <div class="screen"><img src="../public/assets/screens/league.webp" alt=""></div>
  </div>
</section>
</body>
</html>
